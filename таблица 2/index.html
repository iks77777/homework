<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="./css/styles.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form-group">
				<legend class="form-group-title">Ваши личные данные</legend>
				<label for="name" class="label">Ваше имя</label>
				<input
					id="name"
					class="input"
					type="text"
					placeholder="Имя"
					name="name"
					required
				/>
				<label for="age" class="label">Ваш возраст</label>
				<input
					id="age"
					class="input"
					type="number"
					placeholder="Возраст"
					name="age"
					required
				/>
				<label for="age" class="label">Ваш номер телефона</label>
				<input
					id="phone"
					class="input"
					type="tel"
					placeholder=" Номер телефон"
					name="phone"
					required
				/>
				<label for="mail" class="label">Ваша почта</label>
				<input
					id="mail"
					class="input"
					type="text"
					placeholder=" Почта"
					name="mail"
					required
				/>
			</fieldset>
			<fieldset class="form-group">
				<label class="label" for="message">Сообщение</label>
				<textarea
					id="message"
					class="textarea"
					placeholder="Ваше сообщение"
					name="message"
					required
				></textarea>

				<label class="label">
					<input class="checkbox" name="checkbox" type="checkbox" required />
					Я принимаю правила
				</label>
			</fieldset>
			<button class="button">Отправить</button>
		</form>
	</body>
</html>
