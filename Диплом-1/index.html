<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/shop-favicon-32x32.png"
			type="image/x-png"
		/>
		<script defer src="./js/index.js" type="module"></script>
		<title>SHOP.CO</title>
	</head>
	<body class="page__body">
		<aside class="sale__registration">
			<div class="container sale-registration__container">
				<p class="sale__cap">
					Зарегистрируйтесь и получите скидку 20% на первую покупку.
				</p>
				<a class="sale__cap-text" href="#" id="registerLink"
					>Зарегистрироваться сейчас</a
				>
				<button class="sale__actions-button">
					<img
						class="sale__cross"
						src="./icons/logo-icon.svg"
						width="13"
						height="13"
						alt="Крест"
					/>
				</button>
			</div>
		</aside>
		<header class="header">
			<div class="container header__container">
				<a class="text" href="#">
					<img
						src="./icons/SHOP.CO.svg"
						alt="Название магазина"
						width="160"
						height="22"
				/></a>
				<nav
					class="menu header__menu"
					id="header__menu"
					aria-label="Главное меню"
				>
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#shop" class="menu__link">Магазин</a>
						</li>
						<li class="menu__item">
							<a href="#discounts" class="menu__link">Скидки</a>
						</li>
						<li class="menu__item">
							<a href="#new arrivals" class="menu__link">Новые поступления</a>
						</li>
						<li class="menu__item">
							<a href="#brands" class="menu__link">Бренды</a>
						</li>
					</ul>
				</nav>
				<form>
					<label class="header__label">
						<img
							class="header__Frame"
							src="./icons/Frame.svg"
							width="24"
							height="24"
							alt="Лупа"
						/>
						<input
							class="header__input"
							type="text"
							placeholder="Искать товары…"
						/>
					</label>
				</form>
				<div class="header__actions">
					<button class="header__actions-button">
						<svg width="24" height="24">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#basket"
							></use>
						</svg>
					</button>
					<button class="header__actions-button">
						<svg width="24" height="24">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#user"
							></use>
						</svg>
					</button>
					<button
						class="header__burger burger"
						aria-label="Открыть меню"
						aria-expanded="false"
						aria-controls="header__menu"
					>
						<svg width="24" height="24">
							<use
								class="burger__icon-menu"
								href="./icons/sprite.svg#menu-burger"
							></use>
							<use
								class="burger__icon-cross"
								href="./icons/sprite.svg#menu-cross"
							></use>
						</svg>
					</button>
				</div>
			</div>
		</header>
	</body>
</html>
