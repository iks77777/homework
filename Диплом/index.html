<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/shop-favicon-32x32.png"
			type="image/x-png"
		/>
		<title>SHOP.CO</title>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<span class="header__cap"
					>Зарегистрируйтесь и получите скидку 20% на первую покупку.</span
				>
				<span header__cap>
					<a class="cap" href="#" id="registerLink"
						>Зарегистрироваться сейчас</a
					>

					<img
						class="header__cross"
						src="./icons/logo-icon.svg"
						width="8"
						height="8"
						alt="Крест"
					/>
				</span>
			</div>
		</header>
		<header class="header-2">
			<div class="container header__container-2">
				<p class="text">SHOP.CO</p>
				<nav class="menu header__menu" aria-label="Главное меню">
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#shop" class="menu__link">Магазин</a>
						</li>
						<li class="menu__item">
							<a href="#discounts" class="menu__link">Скидки</a>
						</li>
						<li class="menu__item">
							<a href="#new arrivals" class="menu__link">Новые поступления</a>
						</li>
						<li class="menu__item">
							<a href="#brands" class="menu__link">Бренды</a>
						</li>
					</ul>
				</nav>
				<div>
					<img
						class="header__Frame"
						src="./icons/Frame.svg"
						width="24"
						height="24"
						alt="Лупа"
					/>
					<input
						class="header__input"
						type="text"
						placeholder="Искать товары…"
					/>
				</div>
				<div class="header__actions">
					<button class="header__actions-button">
						<svg width="24" height="24">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#basket"
							></use>
						</svg>
					</button>
					<button class="header__actions-button">
						<svg width="24" height="24">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#user"
							></use>
						</svg>
					</button>
					<button class="header__burger burger">
						<svg width="24" height="24">
							<use
								class="burger__icon-menu"
								href="./icons/sprite.svg#menu-burger"
							></use>
						</svg>
					</button>
				</div>
			</div>
		</header>
	</body>
</html>
